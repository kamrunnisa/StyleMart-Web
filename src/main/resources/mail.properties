# SMTP configuration for OTP / transactional emails.
# Leave mail.enabled=false to keep the current dev behavior (OTP printed to
# the server console instead of emailed) while you're testing locally.
#
# Example for a Gmail account (use an App Password, not your login password):
#   mail.smtp.host=smtp.gmail.com
#   mail.smtp.port=587
#   mail.smtp.username=yourshop@gmail.com
#   mail.smtp.password=your-16-char-app-password
#   mail.from=yourshop@gmail.com
#   mail.enabled=true

mail.enabled=false
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.username=
mail.smtp.password=
mail.from=noreply@stylemart.com
mail.from.name=StyleMart
